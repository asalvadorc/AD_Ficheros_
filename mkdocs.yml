site_name: AD - Acceso a Datos - Ficheros

extra_css:
  - css/extra.css
  - css/copy-button.css

extra_javascript:
  - js/copy-button.js  

theme: 
  name: readthedocs
  features:
    - navigation.expand
    - navigation.sections
    - navigation.tabs
    - copy-to-clipboard
    - content.code.copy
  logo: assets/logocaminas.png
  favicon: img/favicon.ico
    

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables    
  - attr_list
  - toc
  - md_in_html

nav:
- Guía de estudio: index.md
- 🧰 Entorno y Ubicación de Ejemplos: 00_entorno_y_proyecto.md
- RA y CE: RA_CE.md
